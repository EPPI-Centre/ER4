<div class="card container-fluid mt-1 bg-light  m-1 p-1 form-group  border border-primary ">
  <form class="row" (ngSubmit)="onSubmit()">
    <div class="col-12">
      <div class="form-group">
        <label for="rev1">Reviewer 1</label>
        <select class="col-md-6 form-control" name="rev1"
          [disabled]="!HasWriteRights" [(ngModel)]="selectedReviewer1" >
          <option> </option>
          @for (member of Contacts; track member) {
            <option
              [ngValue]="member" [selected]="member == selectedReviewer1">
              {{member.contactName}}
            </option>
          }
        </select>
      </div>
    </div>
    <div class="col-12">
      <div class="form-group">
        <label for="rev2">Reviewer 2</label>
        <select class="col-md-6 form-control" name="rev2"
          [disabled]="!HasWriteRights" [(ngModel)]="selectedReviewer2">
          <option> </option>
          @for (member of Contacts; track member) {
            <option
              [ngValue]="member" [selected]="member == selectedReviewer2">
              {{member.contactName}}
            </option>
          }
        </select>
      </div>
    </div>
    <div class="col-12">
      <div class="form-group">
        <label for="rev3">Reviewer 3 (optional)</label>
        <select class="col-md-6 form-control" name="rev3"
          [disabled]="!HasWriteRights" [(ngModel)]="selectedReviewer3">
          <option> </option>
          @for (member of Contacts; track member) {
            <option
              name="rev3" [ngValue]="member" [selected]="member == selectedReviewer3">
              {{member.contactName}}
            </option>
          }
        </select>
      </div>
    </div>
    <div class="col-12">
      @if (CodeSets) {
        <div class="form-group">
          <label for="codeSET">Code set</label>
          <select class="col-md-6 form-control" [disabled]="!HasWriteRights"
            name="codeSET" [(ngModel)]="selectedCodeSet">
            @for (item of CodeSets; track item) {
              <option name="codeSET"
                [ngValue]="item"  [selected]="item == selectedCodeSet">
                {{item.name}}
              </option>
            }
          </select>
        </div>
      }
    </div>
    <div class="col-12">
      <div class="form-group col-12 row">
        <div style="min-width: 100px;">
          <span >Selected Filter: &nbsp;</span>
        </div>
        @if (chosenFilter && chosenFilter.nodeType == 'SetAttribute') {
          <div class="col-10">
            <span>
              <b>{{chosenFilter.name}}</b>
            </span>
          </div>
        }
      </div>
      <div class="col-12 m-2">
        <button (click)="SetFilter()" [disabled]="!canSetFilter()" class="btn btn-primary btn-sm" type="button"> Set Filter</button>&nbsp;
        <button (click)="clearChosenFilter()" class="btn btn-outline-info btn-sm" type="button"> Clear Filter</button>
      </div>
    </div>
    <div class="col-12">
      <button type="button" (click)="CreateNewComparison()" class="btn btn-success ml-2 mr-2"
        [disabled]="!HasWriteRights || CanCreateComparison()" style="width:200px;">
        Create Comparison
      </button>
      <button class="btn btn-outline-secondary ml-1" type="button"
        (click)="CancelActivity()" style="width:200px;">
        Cancel
      </button>
    </div>
  </form>
</div>
